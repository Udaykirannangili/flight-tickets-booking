<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Boarding Pass</title>
    <style>
        body {
            background-color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Ticket Container */
        .ticket {
            display: flex;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 750px;
            overflow: hidden;
            position: relative;
        }

        /* Reusable styles for text */
        .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .value {
            font-size: 16px;
            color: #1e293b;
            font-weight: 600;
        }

        /* Main Section */
        .main-section {
            padding: 25px;
            flex: 2;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .airline-name {
            font-size: 18px;
            font-weight: 700;
            color: #2563eb;
        }

        .flight-class {
            background: #dbeafe;
            color: #2563eb;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .route {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .airport-code {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
        }

        .airport-name {
            font-size: 12px;
            color: #64748b;
        }

        .plane-icon {
            color: #cbd5e1;
            font-size: 24px;
        }

        .grid-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Stub / Tear-off Section */
        .stub-section {
            background: #f8fafc;
            padding: 25px;
            flex: 1;
            border-left: 2px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Circular cuts for the tear-off look */
        .stub-section::before, .stub-section::after {
            content: '';
            position: absolute;
            left: -10px;
            width: 20px;
            height: 20px;
            background: #e2e8f0;
            border-radius: 50%;
        }
        .stub-section::before { top: -10px; }
        .stub-section::after { bottom: -10px; }

        .stub-route {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stub-route .airport-code {
            font-size: 20px;
        }

        /* Fake Barcode Generation */
        .barcode {
            height: 45px;
            background: linear-gradient(90deg, 
                #000 0%, #000 2%, transparent 2%, transparent 4%,
                #000 4%, #000 8%, transparent 8%, transparent 9%,
                #000 9%, #000 10%, transparent 10%, transparent 14%,
                #000 14%, #000 15%, transparent 15%, transparent 16%,
                #000 16%, #000 20%, transparent 20%, transparent 22%,
                #000 22%, #000 25%, transparent 25%, transparent 26%,
                #000 26%, #000 28%, transparent 28%, transparent 32%,
                #000 32%, #000 35%, transparent 35%, transparent 40%,
                #000 40%, #000 41%, transparent 41%, transparent 44%,
                #000 44%, #000 48%, transparent 48%, transparent 52%,
                #000 52%, #000 56%, transparent 56%, transparent 60%,
                #000 60%, #000 65%, transparent 65%, transparent 68%,
                #000 68%, #000 72%, transparent 72%, transparent 75%,
                #000 75%, #000 80%, transparent 80%, transparent 85%,
                #000 85%, #000 90%, transparent 90%, transparent 95%,
                #000 95%, #000 100%
            );
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="ticket">
        <!-- Main Ticket Body -->
        <div class="main-section">
            <div class="header">
                <span class="airline-name">SKYLINE AIRWAYS</span>
                <span class="flight-class">Economy Class</span>
            </div>
            
            <div class="route">
                <div>
                    <h2 class="airport-code">JFK</h2>
                    <span class="airport-name">New York, USA</span>
                </div>
                <div class="plane-icon">✈</div>
                <div style="text-align: right;">
                    <h2 class="airport-code">LHR</h2>
                    <span class="airport-name">London, UK</span>
                </div>
            </div>

            <div class="grid-info">
                <div>
                    <div class="label">Passenger</div>
                    <div class="value">Jane Doe</div>
                </div>
                <div>
                    <div class="label">Flight</div>
                    <div class="value">SA-402</div>
                </div>
                <div>
                    <div class="label">Date</div>
                    <div class="value">28 OCT 2026</div>
                </div>
                <div>
                    <div class="label">Gate</div>
                    <div class="value">B22</div>
                </div>
                <div>
                    <div class="label">Boarding Time</div>
                    <div class="value">14:20</div>
                </div>
                <div>
                    <div class="label">Seat</div>
                    <div class="value">12A</div>
                </div>
            </div>
        </div>

        <!-- Tear-off Passenger Stub -->
        <div class="stub-section">
            <div>
                <div class="airline-name" style="font-size: 14px; margin-bottom: 15px;">SKYLINE</div>
                
                <div class="stub-route">
                    <span class="airport-code">JFK</span>
                    <span style="color: #cbd5e1;">➔</span>
                    <span class="airport-code">LHR</span>
                </div>

                <div style="margin-bottom: 10px;">
                    <div class="label">Passenger</div>
                    <div class="value" style="font-size: 14px;">Jane Doe</div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div>
                        <div class="label">Seat</div>
                        <div class="value" style="font-size: 14px;">12A</div>
                    </div>
                    <div>
                        <div class="label">Flight</div>
                        <div class="value" style="font-size: 14px;">SA-402</div>
                    </div>
                </div>
            </div>
            
            <div>
                <div class="barcode"></div>
            </div>
        </div>
    </div>

</body>
</html>
